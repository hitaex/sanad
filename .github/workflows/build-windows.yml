name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install PyQt6 rapidfuzz pyinstaller
    
    - name: Build EXE
      run: |
        pyinstaller --name=HadithChainApp --windowed --onefile --add-data "Data;Data" --add-data "info;info" --add-data "image_1.png;." src/main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: HadithChainApp-Windows
        path: dist/HadithChainApp.exe
